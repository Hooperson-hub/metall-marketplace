# WebSocket (чат в реальном времени): для обычных запросов Connection пустой, чтобы работали keep-alive соединения
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Supabase. Если часть его адресов недоступна с сервера, nginx быстро переходит к рабочему
# и некоторое время не обращается к неработающему.
upstream supabase_backend {
  server otwrmnsirwhhuvoacebr.supabase.co:443 max_fails=1 fail_timeout=60s;
  keepalive 16;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Прокси к Supabase: браузер ходит на наш домен, сервер в России сам обращается к Supabase.
  # Если у вашего проекта другой адрес, замените его в двух местах: в upstream выше и в proxy_ssl_name / Host ниже.
  location /supabase/ {
    rewrite ^/supabase/(.*)$ /$1 break;
    proxy_pass https://supabase_backend;
    proxy_ssl_server_name on;
    proxy_ssl_name otwrmnsirwhhuvoacebr.supabase.co;
    proxy_set_header Host otwrmnsirwhhuvoacebr.supabase.co;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 6;
    proxy_next_upstream_timeout 20s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Файлы сборки имеют уникальные имена: кэшируем надолго, страницы грузятся быстрее
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

