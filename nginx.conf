map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Прокси к Supabase: браузер ходит на наш домен, сервер в России сам обращается к Supabase.
  # Если у вашего проекта другой адрес, замените значение в строке set $sb ...
  location /supabase/ {
    resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
    set $sb otwrmnsirwhhuvoacebr.supabase.co;
    rewrite ^/supabase/(.*)$ /$1 break;
    proxy_pass https://$sb;
    proxy_ssl_server_name on;
    proxy_ssl_name $sb;
    proxy_set_header Host $sb;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Файлы сборки имеют уникальные имена: кэшируем надолго, страницы грузятся быстрее
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
